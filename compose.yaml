include:
    - proxy.yaml
services:
    web:
      build:
        context: .
        dockerfile: Dockerfile.python
      container_name: web
      restart: always

      env_file:
        - .env

      environment:
        # Подключение к MySQL по сетевому имени сервиса "db"
        #MYSQL_HOST: 172.20.0.10
        #MYSQL_PORT: "3306"
        DB_HOST: db
        DB_NAME: ${MYSQL_DATABASE}
        DB_USER: ${MYSQL_USER}
        DB_PASSWORD: ${MYSQL_PASSWORD}
        
      networks:
        backend:
          ipv4_address: 172.20.0.5
      depends_on:
        db:
          condition: service_healthy
    
    db:
      image: mysql:8
      container_name: db
      restart: always
      
      env_file:
        - .env
      environment:
        # Обязательные переменные для инициализации MySQL
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      
      volumes:
        - db_data:/var/lib/mysql
      
      networks:
        backend:
          ipv4_address: 172.20.0.10
      
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s
volumes:
  db_data:
